apiVersion: apps/v1
kind: Deployment

metadata:
  name: insurance-app-prod

spec:
  replicas: 3

  selector:
    matchLabels:
      app: insurance-app-prod

  template:
    metadata:
      labels:
        app: insurance-app-prod

    spec:
      containers:
      - name: insurance-app
        image: insurance-app:v1

        ports:
        - containerPort: 80