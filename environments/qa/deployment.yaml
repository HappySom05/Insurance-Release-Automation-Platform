apiVersion: apps/v1
kind: Deployment

metadata:
  name: insurance-app-qa

spec:
  replicas: 2

  selector:
    matchLabels:
      app: insurance-app-qa

  template:
    metadata:
      labels:
        app: insurance-app-qa

    spec:
      containers:
      - name: insurance-app
        image: insurance-app:v1

        ports:
        - containerPort: 80